        // ============================================================
        // 1. 工具函数
        // ============================================================
        function escapeHtml(s) {
          if (typeof s !== "string") return "";
          return s.replace(/[&<>"']/g, function (m) {
            return {
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[m];
          });
        }

        function generateHash(s) {
          var h = 0;
          for (var i = 0; i < s.length; i++) {
            h = (h << 5) - h + s.charCodeAt(i);
            h = h & h;
          }
          return "chat_" + Math.abs(h).toString(16);
        }

        function formatTime(ts) {
          if (!ts && ts !== 0) return "";
          try {
            var d;
            if (typeof ts === "number") {
              d = ts < 1e10 ? new Date(ts * 1000) : new Date(ts);
            } else if (typeof ts === "string") {
              var t = ts.trim(),
                n = parseInt(t);
              if (!isNaN(n) && t.length > 0) {
                d = n < 1e10 ? new Date(n * 1000) : new Date(n);
              } else {
                d = new Date(t.replace(" ", "T"));
              }
            } else return "";
            if (isNaN(d.getTime())) return "";
            return d.toLocaleString("zh-CN", {
              year: "numeric",
              month: "2-digit",
              day: "2-digit",
              hour: "2-digit",
              minute: "2-digit",
              second: "2-digit",
            });
          } catch (_) {
            return "";
          }
        }

        function escapeRegex(s) {
          return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        }

        function parseRegex(s) {
          if (!s || typeof s !== "string") return null;
          var t = s.trim(),
            m = t.match(/^\/(.+)\/([a-z]*)$/);
          if (m) {
            try {
              var f = m[2] || "";
              if (!f.includes("g")) f += "g";
              return new RegExp(m[1], f);
            } catch (_) {
              return null;
            }
          }
          return null;
        }

        function buildExcludePatterns(list) {
          var p = [];
          list.forEach(function (tag) {
            var rx = parseRegex(tag);
            if (rx) {
              p.push({ type: "regex", regex: rx });
              return;
            }
            if (tag.includes(":") && !tag.startsWith("</")) {
              var ci = tag.indexOf(":");
              var tn = tag.slice(0, ci).trim().replace(/^<|>$/g, "");
              var kw = tag.slice(ci + 1).trim();
              if (tn && kw) {
                p.push({
                  type: "conditional",
                  regex: new RegExp(
                    "<" +
                      escapeRegex(tn) +
                      "[^>]*>\\s*<summary[^>]*>[^<]*" +
                      escapeRegex(kw) +
                      "[^<]*</summary>[\\s\\S]*?</" +
                      escapeRegex(tn) +
                      ">",
                    "gi",
                  ),
                });
                return;
              }
            }
            if (tag.startsWith("</") && tag.endsWith(">")) {
              var tn2 = tag.slice(2, -1);
              p.push({
                type: "before",
                regex: new RegExp(
                  "^[\\s\\S]*?<\\/" + escapeRegex(tn2) + ">",
                  "gi",
                ),
              });
              return;
            }
            var ct = tag.replace(/^<|>$/g, "");
            p.push({
              type: "pair",
              regex: new RegExp(
                "<" +
                  escapeRegex(ct) +
                  "(?:\\s[^>]*)?>[\\s\\S]*?</" +
                  escapeRegex(ct) +
                  ">",
                "gi",
              ),
            });
          });
          return p;
        }

        function applyExcludePatterns(content, patterns) {
          if (!patterns || !patterns.length) return content;
          var r = content;
          patterns.forEach(function (p) {
            r = r.replace(p.regex, "");
          });
          return r.replace(/\n{3,}/g, "\n\n").trim();
        }

        function extractTagContent(text, list, enable) {
          if (!enable || !list || !list.length) return text;
          var results = [];
          list.forEach(function (item) {
            var rx = parseRegex(item);
            if (rx) {
              var m = text.matchAll(rx);
              for (var v of m) results.push(v.length > 1 ? v[1] : v[0]);
              return;
            }
            var tag = item.replace(/^<|>$/g, "");
            var re = new RegExp(
              "<" +
                escapeRegex(tag) +
                "(?:\\s[^>]*)?>([\\s\\S]*?)</" +
                escapeRegex(tag) +
                ">",
              "gi",
            );
            var m2 = text.matchAll(re);
            for (var v2 of m2) results.push(v2[1]);
          });
          return results.length ? results.join("\n\n") : "";
        }

        function scanTags(messages) {
          var counts = {},
            htmlTags = [
              "br",
              "img",
              "p",
              "div",
              "span",
              "audio",
              "video",
              "strong",
              "em",
              "u",
              "s",
              "code",
              "pre",
              "hr",
              "h1",
              "h2",
              "h3",
              "h4",
              "h5",
              "h6",
              "input",
              "button",
              "script",
              "style",
              "link",
              "meta",
              "table",
              "thead",
              "tbody",
              "tr",
              "td",
              "th",
              "b",
              "i",
              "font",
              "center",
              "strike",
            ];
          messages.forEach(function (msg) {
            var text = msg.mes || "";
            var m = text.matchAll(
              /<([\u4e00-\u9fa5a-zA-Z0-9_\-\.]+)(?:\s[^>]*)?>[\s\S]*?<\/\1>/g,
            );
            for (var v of m) {
              var t = v[1],
                tl = t.toLowerCase();
              if (htmlTags.indexOf(tl) === -1) counts[t] = (counts[t] || 0) + 1;
            }
          });
          return Object.keys(counts).sort(function (a, b) {
            return counts[b] - counts[a];
          });
        }
        // ============================================================
        // 2. IndexedDB
        // ============================================================
        var DB_NAME = "STReaderDB",
          STORE_CHATS = "chats",
          db = null;

        function initDB() {
          return new Promise(function (resolve, reject) {
            var req = indexedDB.open(DB_NAME, 1);
            req.onupgradeneeded = function (e) {
              var d = e.target.result;
              if (!d.objectStoreNames.contains(STORE_CHATS))
                d.createObjectStore(STORE_CHATS, { keyPath: "id" });
            };
            req.onsuccess = function () {
              db = req.result;
              resolve(db);
            };
            req.onerror = function () {
              reject(req.error);
            };
          });
        }

        function saveChat(id, data) {
          return new Promise(function (resolve, reject) {
            var tx = db.transaction(STORE_CHATS, "readwrite");
            tx.objectStore(STORE_CHATS).put({ id: id, data: data });
            tx.oncomplete = resolve;
            tx.onerror = function () {
              reject(tx.error);
            };
          });
        }

        function loadAllChats() {
          return new Promise(function (resolve, reject) {
            var tx = db.transaction(STORE_CHATS, "readonly");
            var req = tx.objectStore(STORE_CHATS).getAll();
            req.onsuccess = function () {
              var c = {};
              req.result.forEach(function (item) {
                c[item.id] = item.data;
              });
              resolve(c);
            };
            req.onerror = function () {
              reject(req.error);
            };
          });
        }

        function deleteChatFromDB(id) {
          return new Promise(function (resolve, reject) {
            var tx = db.transaction(STORE_CHATS, "readwrite");
            tx.objectStore(STORE_CHATS).delete(id);
            tx.oncomplete = resolve;
            tx.onerror = function () {
              reject(tx.error);
            };
          });
        }

        function clearAllChatsDB() {
          return new Promise(function (resolve, reject) {
            var tx = db.transaction(STORE_CHATS, "readwrite");
            tx.objectStore(STORE_CHATS).clear();
            tx.oncomplete = resolve;
            tx.onerror = function () {
              reject(tx.error);
            };
          });
        }
        // ============================================================

        var modal = document.getElementById("customModal");

        // ============================================================

        function showCustomPrompt(title, placeholder, defaultValue) {
          return new Promise(function (resolve) {
            modalTitle.textContent = title || "输入";
            modalMessage.style.display = "none";
            modalInput.style.display = "block";
            modalInput.placeholder = placeholder || "请输入...";
            modalInput.value = defaultValue || "";
            modal.classList.add("open");
            modalInput.focus();
            modalInput.select();

            function cleanup() {
              modal.classList.remove("open");
              modalInput.style.display = "none";
              modalMessage.style.display = "block";
              modalConfirmBtn.removeEventListener("click", onConfirm);
              modalCancelBtn.removeEventListener("click", onCancel);
              modalInput.removeEventListener("keydown", onKeydown);
            }

            function onConfirm() {
              cleanup();
              resolve(modalInput.value.trim());
            }

            function onCancel() {
              cleanup();
              resolve(null);
            }

            function onKeydown(e) {
              if (e.key === "Enter") onConfirm();
              else if (e.key === "Escape") onCancel();
            }
            modalConfirmBtn.addEventListener("click", onConfirm);
            modalCancelBtn.addEventListener("click", onCancel);
            modalInput.addEventListener("keydown", onKeydown);
          });
        }

        function showCustomConfirm(title, message) {
          return new Promise(function (resolve) {
            modalTitle.textContent = title || "确认";
            modalMessage.textContent = message || "确定执行此操作？";
            modalMessage.style.display = "block";
            modalInput.style.display = "none";
            modal.classList.add("open");

            function cleanup() {
              modal.classList.remove("open");
              modalMessage.style.display = "block";
              modalConfirmBtn.removeEventListener("click", onConfirm);
              modalCancelBtn.removeEventListener("click", onCancel);
            }

            function onConfirm() {
              cleanup();
              resolve(true);
            }

            function onCancel() {
              cleanup();
              resolve(false);
            }
            modalConfirmBtn.addEventListener("click", onConfirm);
            modalCancelBtn.addEventListener("click", onCancel);
          });
        }

        var toastTimer = null;

        function showToast(msg, type) {
          if (toastTimer) clearTimeout(toastTimer);
          els.statusBar.textContent = msg;
          els.statusBar.className = type === "error" ? "error" : "success";
          els.statusBar.classList.add("visible");
          toastTimer = setTimeout(function () {
            els.statusBar.classList.remove("visible");
          }, 4000);
        }

        function showProgress(msg) {
          if (toastTimer) clearTimeout(toastTimer);
          els.statusBar.textContent = msg;
          els.statusBar.className = "success";
          els.statusBar.classList.add("visible");
        }

        function hideProgress() {
          els.statusBar.classList.remove("visible");
          if (toastTimer) clearTimeout(toastTimer);
        }
        // ============================================================
        // 7. 工具栏显隐
        // ============================================================
        var toolbar = document.getElementById("floatingToolbar");
        var toggleHandle = document.getElementById("toolbarToggle");
        var isToolbarVisible = true,
          lastScrollY = window.scrollY,
          scrollTimer = null,
          ignoreScrollHide = false;

        function showToolbar() {
          if (!isToolbarVisible) {
            isToolbarVisible = true;
            toolbar.classList.remove("hidden");
          }
        }

        function hideToolbar() {
          if (isToolbarVisible && !ignoreScrollHide) {
            isToolbarVisible = false;
            toolbar.classList.add("hidden");
          }
        }

        function toggleToolbar() {
          isToolbarVisible ? hideToolbar() : showToolbar();
        }
        toggleHandle.addEventListener("click", function (e) {
          e.stopPropagation();
          toggleToolbar();
        });

        function handleScroll() {
          if (ignoreScrollHide) return;
          var cur = window.scrollY,
            delta = cur - lastScrollY,
            btns = document.getElementById("scrollButtons");
          if (cur > 200) {
            if (delta > 0) btns.classList.remove("visible");
            else if (delta < 0) btns.classList.add("visible");
          } else {
            btns.classList.remove("visible");
          }
          if (Math.abs(delta) > 20) {
            if (delta > 0) hideToolbar();
            else showToolbar();
          }
          lastScrollY = cur;
        }
        window.addEventListener(
          "scroll",
          function () {
            if (scrollTimer) cancelAnimationFrame(scrollTimer);
            scrollTimer = requestAnimationFrame(handleScroll);
          },
          { passive: true },
        );
        showToolbar();

        // ============================================================

        // ============================================================
        function renderChatList() {
          var ids = Object.keys(state.chats);
          if (!ids.length) {
            els.chatList.innerHTML =
              '<li style="color:var(--ui-text-muted);justify-content:center;">暂无记录</li>';
            return;
          }
          els.chatList.innerHTML = ids
            .map(function (id) {
              var chat = state.chats[id],
                name = chat.name || "未命名",
                count = chat.messages
                  ? chat.messages.length
                  : chat.tokens
                    ? chat.tokens.length
                    : 0,
                active = id === state.currentChatId;
              return (
                '<li class="' +
                (active ? "active" : "") +
                '" onclick="selectChat(\'' +
                id +
                "')\">" +
                '<div class="list-info"><div class="list-title">' +
                escapeHtml(name) +
                '</div><div class="list-meta">' +
                count +
                " 条" +
                (chat.isJsonl ? " 📄" : "") +
                "</div></div>" +
                '<button class="danger" onclick="event.stopPropagation();deleteChatItem(\'' +
                id +
                '\')" style="height:26px;padding:0 6px;">✕</button></li>'
              );
            })
            .join("");
          updateCacheStatus();
        }

        function updateCacheStatus() {
          var ids = Object.keys(state.chats),
            total = 0;
          ids.forEach(function (id) {
            var c = state.chats[id];
            total += c.messages
              ? c.messages.length
              : c.tokens
                ? c.tokens.length
                : 0;
          });
          els.cacheSize.textContent = ids.length + " 个对话 / " + total + " 条";
        }
        // ============================================================

        // ============================================================
        window.selectChat = function (chatId) {

          // 清空缓存（切换聊天时清理）
          state.messageCache = {};
          state.pageTextCache = {};
          state.searchPageCache = {};

            chat.messages &&
            chat.messages.length > 0 &&
            chat.messages[0].mes !== undefined

            state.isJsonlChat = false;

        window.deleteChatItem = async function (chatId) {

            return b.chatId !== chatId;
          });
          saveSettings();
          // 清理缓存
          state.messageCache = {};
          state.pageTextCache = {};
          state.searchPageCache = {};
          if (state.currentChatId === chatId) {
            state.currentChatId = null;

              '<div class="welcome-page"><div class="icon">📖</div><h2>请选择聊天记录</h2></div>';

        // ============================================================
        // 11. 分页构建
        // ============================================================
        function buildJsonlPages() {
          var chat = state.chats[state.currentChatId];
          if (!chat || !chat.messages) {
            state.pages = [];
            return;
          }
          var msgs = chat.messages,
            size = state.pageSize === -1 ? msgs.length : state.pageSize,
            pages = [];
          for (var i = 0; i < msgs.length; i += size)
            pages.push(msgs.slice(i, i + size));
          state.pages = pages;
          updatePaginationUI();
        }

        function buildTokenPages() {
          var chat = state.chats[state.currentChatId];
          if (!chat || !chat.tokens) {
            state.pages = [];
            return;
          }
          var toks = chat.tokens,
            size = state.pageSize === -1 ? toks.length : state.pageSize,
            pages = [];
          for (var i = 0; i < toks.length; i += size)
            pages.push(toks.slice(i, i + size));
          state.pages = pages;
          updatePaginationUI();
        }
        // ============================================================
        // 12. 核心渲染（带缓存）
        // ============================================================
        function getMarkdownRenderer() {
          var renderer = new marked.Renderer();
          renderer.code = function (code, lang) {
            if (lang === "html") {
              var enc = encodeURIComponent(code)
                .replace(/'/g, "%27")
                .replace(/"/g, "%22");
              return (
                '<div class="html-block-wrapper"><iframe src="data:text/html;charset=utf-8,' +
                enc +
                '" sandbox="allow-scripts allow-same-origin allow-modals" style="width:100%;border:none;background:#fff;height:200px;" onload="(function(el){function resize(){try{var doc=el.contentWindow.document;var h=doc.documentElement.scrollHeight||doc.body.scrollHeight||200;if(h>50)el.style.height=(h+20)+\'px\';}catch(e){el.style.height=\'800px\';}}resize();setTimeout(resize,500);setTimeout(resize,1500);})(this)"></iframe></div>'
              );
            }
            var safe = code
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;");
            return (
              '<pre><code class="language-' +
              (lang || "text") +
              '">' +
              safe +
              "</code></pre>"
            );
          };
          return renderer;
        }

        // 对单个消息内容进行解析（带缓存）
        function getMessageHtml(
          chatId,
          pageIndex,
          msgIdx,
          rawContent,
          renderer,
        ) {
          var key = chatId + "_" + pageIndex + "_" + msgIdx;
          if (state.messageCache[key]) return state.messageCache[key];
          // 处理代码块特殊逻辑
          var html = "";
          var cb = rawContent.match(/```html\s*([\s\S]*?)```/);
          if (cb) {
            var enc = encodeURIComponent(cb[1])
              .replace(/'/g, "%27")
              .replace(/"/g, "%22");
            html =
              '<div class="html-block-wrapper"><iframe src="data:text/html;charset=utf-8,' +
              enc +
              '" sandbox="allow-scripts allow-same-origin allow-modals" style="width:100%;border:none;background:#fff;height:200px;" onload="(function(el){function resize(){try{var doc=el.contentWindow.document;var h=doc.documentElement.scrollHeight||doc.body.scrollHeight||200;if(h>50)el.style.height=(h+20)+\'px\';}catch(e){el.style.height=\'800px\';}}resize();setTimeout(resize,500);setTimeout(resize,1500);})(this)"></iframe></div>';
          } else {
            html = marked.parse(rawContent, { renderer: renderer });
          }
          state.messageCache[key] = html;
          return html;
        }

        // 后处理：引用 + 搜索高亮（优化版：只遍历一次）
        function postProcessTextNodes(root, highlightQuery) {
          var walker = document.createTreeWalker(
            root,
            NodeFilter.SHOW_TEXT,
            null,
            false,
          );
          var nodes = [];
          var node;
          while ((node = walker.nextNode())) nodes.push(node);
          var hasHighlight = highlightQuery && highlightQuery.trim().length > 0;
          var q = hasHighlight ? highlightQuery.trim() : "";
          var regexQ = hasHighlight
            ? new RegExp("(" + escapeRegex(q) + ")", "gi")
            : null;
          for (var ni = 0; ni < nodes.length; ni++) {
            var tn = nodes[ni];
            var text = tn.textContent;
            if (!text.trim()) continue;
            // 检查是否有引号
            var parts = [];
            var lastIdx = 0;
            var re = /“([^”]*)”|"([^"]*)"/g;
            var m;
            var hasQuote = false;
            while ((m = re.exec(text)) !== null) {
              hasQuote = true;
              var content = m[1] || m[2] || "";
              var full = m[0];
              var start = m.index,
                end = start + full.length;
              if (start > lastIdx)
                parts.push({
                  type: "text",
                  content: text.substring(lastIdx, start),
                });
              parts.push({ type: "quote", content: content, full: full });
              lastIdx = end;
            }
            if (!hasQuote) {
              // 只有高亮
              if (hasHighlight && regexQ) {
                var newText = text.replace(
                  regexQ,
                  '<mark class="search-highlight">$1</mark>',
                );
                if (newText !== text) {
                  var span = document.createElement("span");
                  span.innerHTML = newText;
                  tn.parentNode.replaceChild(span, tn);
                }
              }
              continue;
            }
            if (lastIdx < text.length)
              parts.push({ type: "text", content: text.substring(lastIdx) });
            var frag = document.createDocumentFragment();
            for (var pi = 0; pi < parts.length; pi++) {
              var part = parts[pi];
              if (part.type === "text") {
                var c = part.content;
                if (hasHighlight && regexQ) {
                  c = c.replace(
                    regexQ,
                    '<mark class="search-highlight">$1</mark>',
                  );
                }
                if (c) {
                  var sp = document.createElement("span");
                  sp.innerHTML = c;
                  frag.appendChild(sp);
                }
              } else {
                var c2 = part.content;
                if (hasHighlight && regexQ) {
                  c2 = c2.replace(
                    regexQ,
                    '<mark class="search-highlight">$1</mark>',
                  );
                }
                var sp2 = document.createElement("span");
                sp2.className = "quote-text";
                sp2.innerHTML =
                  part.full.charAt(0) +
                  c2 +
                  part.full.charAt(part.full.length - 1);
                frag.appendChild(sp2);
              }
            }
            tn.parentNode.replaceChild(frag, tn);
          }
        }

        // 渲染当前页（使用缓存）
        function renderCurrentPage(noScroll) {
          if (!state.currentChatId || !state.pages.length) {
            els.content.innerHTML =
              '<div class="welcome-page"><div class="icon">📖</div><h2>请选择聊天记录</h2></div>';
            els.pageInfo.textContent = "0 / 0";
            els.pageInfoBottom.textContent = "0 / 0";
            return;
          }
          var pageIdx = Math.min(
            Math.max(state.currentPage - 1, 0),
            state.pages.length - 1,
          );
          state.currentPage = pageIdx + 1;
          var pageData = state.pages[pageIdx];
          var renderer = getMarkdownRenderer();
          var searchQuery = state.currentSearchQuery.trim();
          var html = "";

          if (state.isJsonlChat) {
            var allMsgs = state.chats[state.currentChatId].messages;
            var startIdx = -1;
            if (pageData.length) {
              var first = pageData[0];
              startIdx = allMsgs.indexOf(first);
              if (startIdx === -1) {
                for (var i2 = 0; i2 < allMsgs.length; i2++) {
                  if (
                    allMsgs[i2] === first ||
                    (allMsgs[i2].message_id !== undefined &&
                      allMsgs[i2].message_id === first.message_id) ||
                    (allMsgs[i2].id !== undefined &&
                      allMsgs[i2].id === first.id)
                  ) {
                    startIdx = i2;
                    break;
                  }
                }
              }
              if (startIdx === -1) startIdx = 0;
            } else startIdx = 0;

            var excludePatterns = buildExcludePatterns(state.excludeTags);
            var extractEnabled = state.settings.extractEnabled;

            for (var mi = 0; mi < pageData.length; mi++) {
              var msg = pageData[mi];
              var isUser = msg.is_user;
              var sender = msg.name || (isUser ? "User" : "Char");
              var time = formatTime(msg.send_date);
              var floor =
                msg.message_id !== undefined &&
                msg.message_id !== null &&
                msg.message_id !== ""
                  ? msg.message_id
                  : msg.id !== undefined && msg.id !== null && msg.id !== ""
                    ? msg.id
                    : startIdx + mi;
              var floorStr = String(floor);
              var floorMatch =
                searchQuery &&
                floorStr.toLowerCase().indexOf(searchQuery.toLowerCase()) !==
                  -1;

              var content = msg.mes || "";
              // 排除
              content = applyExcludePatterns(content, excludePatterns);
              // 提取
              if (extractEnabled)
                content =
                  extractTagContent(content, state.extractTags, true) || "";
              if (!content.trim()) continue;

              var cacheKey = state.currentChatId + "_" + pageIdx + "_" + mi;
              var contentHtml = state.messageCache[cacheKey];
              if (contentHtml === undefined) {
                contentHtml = getMessageHtml(
                  state.currentChatId,
                  pageIdx,
                  mi,
                  content,
                  renderer,
                );
              }

              var isBookmarked = state.bookmarks.some(function (b) {
                return (
                  b.chatId === state.currentChatId &&
                  b.page === state.currentPage &&
                  b.messageIndex === mi
                );
              });
              var floorCls =
                "message-floor" + (floorMatch ? " search-highlight" : "");
              var floorHtml =
                '<span class="' +
                floorCls +
                '">#' +
                escapeHtml(floorStr) +
                "</span>";
              var msgCls =
                (isUser ? "user" : "char") +
                (floorMatch ? " floor-highlight" : "");

              html +=
                '<div class="message ' +
                msgCls +
                '" data-page="' +
                state.currentPage +
                '" data-index="' +
                mi +
                '" data-floor="' +
                floorStr +
                '">' +
                '<div class="message-header">' +
                '<span class="message-sender">' +
                escapeHtml(sender) +
                "</span>" +
                floorHtml +
                (time ? '<span class="message-time">' + time + "</span>" : "") +
                '<button class="bookmark-btn ' +
                (isBookmarked ? "bookmarked" : "") +
                '" onclick="toggleBookmark(' +
                state.currentPage +

                mi +
                ')">' +
                (isBookmarked ? "★" : "☆") +
                "</button>" +

                '<div class="message-content">' +
                contentHtml +
                "</div>" +
                "</div>";
            }
          } else {
            // Tokens 模式：用 marked.parser
            html = marked.parser(pageData, { renderer: renderer });
          }

          // 设置内容
          els.content.innerHTML =
            html ||
            '<p style="color:var(--ui-text-muted);padding:20px;">该页无内容</p>';

          // 后处理：引用 + 高亮
          if (state.isJsonlChat) {
            var root = els.content;
            // 先清理可能残留的高亮标记（如果是重新渲染）
            // 但 postProcessTextNodes 会处理，不需要额外清理
            postProcessTextNodes(root, state.currentSearchQuery);

          // 更新分页信息

            total === 1 && state.pageSize === -1

              : state.currentPage + " / " + total;

          els.pageInfoBottom.textContent = info;
          updatePaginationButtons();

          els.jumpPage.max = total;
          els.jumpPageBottom.value = state.currentPage;
          els.jumpPageBottom.max = total;
          els.content.classList.toggle("jsonl-mode", state.isJsonlChat);

          // 滚动到高亮
          if (!noScroll) {
            if (state.searchMatches.length && state.searchIndex >= 0) {
              var fh = els.content.querySelector(".message.floor-highlight");

                fh.scrollIntoView({ behavior: "smooth", block: "start" });

              }
              var fm = els.content.querySelector(".search-highlight");
              if (fm) {
                fm.scrollIntoView({ behavior: "smooth", block: "center" });
                return;
              }
            }
            window.scrollTo({ top: 0, behavior: "smooth" });
          }
        }
        // ============================================================
        // 13. 分页控制
        // ============================================================
        function updatePaginationUI() {
          var total = state.pages.length,
            info =
              total === 1 && state.pageSize === -1
                ? "无分页"
                : state.currentPage + " / " + total;
          els.pageInfo.textContent = info;
          els.pageInfoBottom.textContent = info;
          updatePaginationButtons();
        }

        function updatePaginationButtons() {
          var total = state.pages.length,
            dp = total <= 1 || state.currentPage <= 1,
            dn = total <= 1 || state.currentPage >= total;
          els.prevPage.disabled = dp;
          els.nextPage.disabled = dn;
          els.prevPageBottom.disabled = dp;
          els.nextPageBottom.disabled = dn;
          els.jumpPage.value = state.currentPage;
          els.jumpPage.max = total;
          els.jumpPageBottom.value = state.currentPage;
          els.jumpPageBottom.max = total;
        }

        function goToPage(p) {
          if (p < 1) p = 1;
          if (p > state.pages.length) p = state.pages.length;
          state.currentPage = p;
          renderCurrentPage(false);
        }

        function changePage(delta) {
          var np = state.currentPage + delta;
          if (np >= 1 && np <= state.pages.length) goToPage(np);

        });

          changePage(1);
        });

          changePage(-1);
        });
        els.nextPageBottom.addEventListener("click", function () {
          changePage(1);
        });

        function jumpHandler(source) {
          var input = source === "bottom" ? els.jumpPageBottom : els.jumpPage;
          var p = parseInt(input.value);

          goToPage(p);
        }

        function applyPageSize() {

        els.pageSizeInput.addEventListener("change", applyPageSize);
        // ============================================================
        // 14. 搜索（带缓存优化）
        // ============================================================
        var searchDebounceTimer = null;

        function performSearch(query) {
          if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
          searchDebounceTimer = setTimeout(function () {
            _performSearch(query);
          }, 300);
        }

        function _performSearch(query) {
          state.currentSearchQuery = query.trim();
          state.searchMatches = [];
          state.searchIndex = -1;
          els.searchPrev.style.display = "none";
          els.searchNext.style.display = "none";
          els.searchClear.style.display = state.currentSearchQuery
            ? "inline-block"
            : "none";

          if (!state.currentSearchQuery || !state.pages.length) {
            els.searchResult.textContent = "";
            renderCurrentPage(true);
            ignoreScrollHide = false;
            return;
          }

          var q = state.currentSearchQuery.toLowerCase();
          var chatId = state.currentChatId;
          var pageTexts = state.searchPageCache[chatId];
          if (!pageTexts) {
            pageTexts = {};
            state.searchPageCache[chatId] = pageTexts;
          }

          var matches = [];
          for (var pi = 0; pi < state.pages.length; pi++) {
            var text = pageTexts[pi];
            if (text === undefined) {
              var page = state.pages[pi];
              var txt = "";
              if (state.isJsonlChat) {
                var allMsgs = state.chats[state.currentChatId].messages;
                var sidx = allMsgs.indexOf(page[0]);
                if (sidx === -1) sidx = 0;
                for (var mi = 0; mi < page.length; mi++) {
                  var msg = page[mi];
                  txt += (msg.mes || "") + " ";
                  var floor =
                    msg.message_id !== undefined &&
                    msg.message_id !== null &&
                    msg.message_id !== ""
                      ? msg.message_id
                      : msg.id !== undefined && msg.id !== null && msg.id !== ""
                        ? msg.id
                        : sidx + mi;
                  txt += "#" + floor + " ";
                }
              } else {
                txt = extractTextFromTokens(page);
              }
              pageTexts[pi] = txt;
              text = txt;
            }
            if (text.toLowerCase().indexOf(q) !== -1) matches.push(pi);
          }

          state.searchMatches = matches;
          if (!matches.length) {
            els.searchResult.textContent = "未找到";
            renderCurrentPage(false);
            return;
          }

          // 修改点：只显示 (x/xx)
          state.searchIndex = 0;
          els.searchResult.textContent =
            "(" + (state.searchIndex + 1) + "/" + matches.length + ")";
          els.searchPrev.style.display = "inline-block";
          els.searchNext.style.display = "inline-block";
          goToPage(matches[0] + 1);
        }

        function extractTextFromTokens(tokens) {
          var text = "";

          function traverse(arr) {
            arr.forEach(function (t) {
              if (t.text) text += t.text + " ";
              if (t.tokens) traverse(t.tokens);
              if (t.type === "heading" && t.text) text += t.text + " ";
              if (t.type === "list" && t.items) {
                t.items.forEach(function (item) {
                  if (item.tokens) traverse(item.tokens);
                });
              }
            });
          }
          traverse(tokens);
          return text;
        }

        function navigateSearch(delta) {

            (state.searchIndex + 1) +

        // ============================================================
        // 15. 收藏

        window.toggleBookmark = async function (page, index) {

            return (
              b.chatId === chatId && b.page === page && b.messageIndex === index
            );

            var confirmed = await showCustomConfirm(
              "取消收藏",
              "确定取消收藏？",

              renderBookmarkList();
              renderCurrentPage(false);
              showToast("已取消收藏", "success");
            }
            return;
          }
          var pageData = state.pages[page - 1];
          if (!pageData) return;
          var msg = pageData[index];
          if (!msg) return;
          var sender = msg.name || (msg.is_user ? "User" : "Char");
          var note = await showCustomPrompt("添加批注", "输入批注（可选）", "");
          if (note === null) return;
          state.bookmarks.push({
            id: Date.now().toString(),
            chatId: chatId,

          renderBookmarkList();
          renderCurrentPage(false);
          showToast("已收藏", "success");
        };

        function renderBookmarkList() {
          els.bookmarkCount.textContent = "(" + state.bookmarks.length + ")";
          if (!state.bookmarks.length) {
            els.bookmarkList.innerHTML =
              '<li style="color:var(--ui-text-muted);justify-content:center;">暂无收藏</li>';
            return;
          }
          var sorted = state.bookmarks.slice().sort(function (a, b) {
            return b.timestamp - a.timestamp;
          });
          els.bookmarkList.innerHTML = sorted
            .map(function (b) {
              var chat = state.chats[b.chatId],
                name = chat ? chat.name : "已删除";
              return (
                "<li onclick=\"jumpToBookmark('" +
                b.id +
                "')\">" +
                '<div class="list-info"><div class="list-title">' +
                escapeHtml(name) +
                " · P" +
                b.page +
                '</div><div class="list-meta">' +
                escapeHtml(b.senderName) +
                "</div>" +
                (b.note
                  ? '<div style="color:var(--ui-primary);font-size:11px;">📝 ' +
                    escapeHtml(b.note) +
                    "</div>"
                  : "") +
                '</div><button class="danger" onclick="event.stopPropagation();deleteBookmarkItem(\'' +
                b.id +
                '\')" style="height:26px;padding:0 6px;">✕</button></li>'
              );
            })
            .join("");
        }
        window.jumpToBookmark = function (id) {

        // ============================================================
        // 16. 文件导入（分块）
        // ============================================================
        function processFileInChunks(file) {
          return new Promise(function (resolve, reject) {
            var reader = new FileReader();
            var ext = file.name.split(".").pop().toLowerCase();
            reader.onload = function (e) {
              var full = e.target.result,
                len = full.length;
              if (!len) {
                reject("文件为空");
                return;
              }
              if (ext === "jsonl") {
                var lines = full.split("\n"),
                  total = lines.length,
                  block = 1000,
                  offset = 0,
                  messages = [],
                  meta = null;

                function nextBlock() {
                  if (offset >= total) {
                    if (!messages.length) {
                      reject("未解析到有效消息");
                      return;
                    }
                    var cname =
                      messages.find(function (m) {
                        return !m.is_user;
                      })?.name || "未知角色";
                    var cid = generateHash(
                      file.name +
                        (messages[0]?.message_id || messages[0]?.id || ""),
                    );
                    var data = {
                      name: cname,
                      file: file.name,
                      messages: messages,
                      metadata: meta,
                      isJsonl: true,
                    };
                    state.chats[cid] = data;
                    resolve(cid);
                    saveChat(cid, data).catch(function (e) {
                      console.warn("保存失败:", e);
                    });
                    return;
                  }
                  var end = Math.min(offset + block, total);
                  var chunk = lines.slice(offset, end);
                  offset = end;
                  for (var i = 0; i < chunk.length; i++) {
                    var line = chunk[i].trim();
                    if (!line) continue;
                    try {
                      var obj = JSON.parse(line);
                      if (obj.chat_metadata) {
                        meta = obj.chat_metadata;
                      } else if (
                        obj.mes !== undefined ||
                        obj.message !== undefined
                      ) {
                        var msg = {
                          message_id: obj.message_id || obj.id || null,
                          name: obj.name || (obj.is_user ? "User" : "Char"),
                          is_user: obj.is_user || obj.role === "user",
                          mes: obj.mes || obj.message || "",
                          send_date: obj.send_date || null,
                        };
                        messages.push(msg);
                      }
                    } catch (_) {}
                  }
                  var pct = Math.min(100, Math.round((offset / total) * 100));
                  showProgress("⏳ 解析 " + file.name + " (" + pct + "%)");
                  setTimeout(nextBlock, 50);
                }
                nextBlock();
              } else {
                var CHUNK_SIZE = 300 * 1024,
                  off = 0,
                  allTokens = [];

                function nextTextChunk() {
                  if (off >= len) {
                    if (!allTokens.length) {
                      reject("文件无有效内容");
                      return;
                    }
                    var cid = generateHash(file.name + allTokens.length);
                    var data = {
                      name: file.name.replace(/\.[^.]+$/, ""),
                      file: file.name,
                      tokens: allTokens,
                      isJsonl: false,
                    };
                    state.chats[cid] = data;
                    resolve(cid);
                    saveChat(cid, data).catch(function (e) {
                      console.warn("保存失败:", e);
                    });
                    return;
                  }
                  var end = Math.min(off + CHUNK_SIZE, len);
                  if (end < len) {
                    var nl = full.indexOf("\n", end);
                    if (nl !== -1 && nl - end < 1000) end = nl + 1;
                  }
                  var chunkText = full.substring(off, end);
                  off = end;
                  var ctokens;
                  try {
                    ctokens = marked.lexer(chunkText);
                  } catch (e) {
                    reject("解析块失败: " + e.message);
                    return;
                  }
                  allTokens = allTokens.concat(ctokens);
                  var pct2 = Math.min(100, Math.round((off / len) * 100));
                  showProgress("⏳ 解析 " + file.name + " (" + pct2 + "%)");
                  setTimeout(nextTextChunk, 50);
                }
                nextTextChunk();
              }
            };
            reader.onerror = function () {
              reject("文件读取失败");
            };
            reader.readAsText(file, "UTF-8");
          });
        }

        function handleFiles(files) {
          var arr = Array.from(files),
            total = arr.length,
            done = 0,
            all = [];
          arr.forEach(function (file) {
            var p = processFileInChunks(file)
              .then(function (cid) {
                done++;
                showProgress("✅ " + done + "/" + total + " 完成");
                return cid;
              })
              .catch(function (err) {
                showToast("❌ " + file.name + " 失败: " + err, "error");
                console.error(err);
              });
            all.push(p);
          });
          Promise.all(all)
            .then(function (results) {
              hideProgress();
              var ok = results.filter(function (id) {
                return id;
              });
              renderChatList();
              updateCacheStatus();
              if (ok.length) {
                var last = ok[ok.length - 1];
                if (state.chats[last]) selectChat(last);
                showToast(
                  "✅ 导入完成 (" + ok.length + "/" + total + ")",
                  "success",
                );
              } else {
                showToast("⚠️ 没有成功导入任何文件", "error");
              }
            })
            .catch(function (err) {
              hideProgress();
              showToast("❌ 导入过程出错: " + err, "error");
            });
        }

        // 标签提取/排除
        function addTagToList(list, inputEl, containerEl, detectedArea) {
          var val = inputEl.value.trim();
          if (!val) return;
          if (list.indexOf(val) === -1) {
            list.push(val);
            inputEl.value = "";
            renderTagList(list, containerEl);
            saveSettings();
            if (detectedArea) detectedArea.style.display = "none";
          } else {
            showToast("标签已存在", "error");
          }
        }

        function removeTag(list, tag, containerEl) {
          var idx = list.indexOf(tag);
          if (idx > -1) list.splice(idx, 1);
          renderTagList(list, containerEl);
          saveSettings();
        }

        function renderTagList(list, container) {
          if (!list.length) {
            container.innerHTML = "";
            return;
          }
          container.innerHTML = list
            .map(function (tag) {
              return (
                '<span class="tag-chip"><span>' +
                escapeHtml(tag) +
                '</span><span class="remove" onclick="removeTagFromList(\'' +
                escapeHtml(tag) +
                "')\">✕</span></span>"
              );
            })
            .join("");
        }
        window.removeTagFromList = function (tag) {
          if (state.extractTags.indexOf(tag) !== -1) {
            removeTag(state.extractTags, tag, els.extractTagList);
          }
          if (state.excludeTags.indexOf(tag) !== -1) {
            removeTag(state.excludeTags, tag, els.excludeTagList);
          }
        };
        els.extractAddBtn.addEventListener("click", function () {
          addTagToList(
            state.extractTags,
            els.extractInput,
            els.extractTagList,
            els.extractDetectedArea,
          );
        });
        els.extractInput.addEventListener("keydown", function (e) {
          if (e.key === " " || e.key === "Enter") {
            e.preventDefault();
            els.extractAddBtn.click();
          }
        });
        els.extractScanBtn.addEventListener("click", function () {
          if (!state.currentChatId) {
            showToast("请先选择聊天", "error");
            return;
          }
          var chat = state.chats[state.currentChatId];
          if (!chat || !chat.messages) {
            showToast("当前聊天不支持扫描", "error");
            return;
          }
          var tags = scanTags(chat.messages);
          state.scanResults.extract = tags;
          renderScanResults("extract");
        });

        function renderScanResults(type) {
          var area =
            type === "extract"
              ? els.extractDetectedArea
              : els.excludeDetectedArea;

              ? state.scanResults.extract

            area.innerHTML = tags

                  "('" +

                  " ➕</span>"
                );
              })
              .join(" ");
          }
          area.style.display = "block";

            presets: state.presets,

        function importSettings(file) {
          var reader = new FileReader();
          reader.onload = function (e) {
            try {
              var data = JSON.parse(e.target.result);
              state.bookmarks = data.bookmarks || [];
              state.extractTags = data.extractTags || [];
              state.excludeTags = data.excludeTags || [];
              state.regexRules = data.regexRules || [];
              state.presets = data.presets || [];
              state.activePresetId = data.activePresetId || "default";
              state.settings = Object.assign({}, state.settings, data.settings);
              saveSettings();
              renderTagList(state.extractTags, els.extractTagList);
              renderTagList(state.excludeTags, els.excludeTagList);
              renderRegexRules();
              loadPresets();
              renderBookmarkList();
              state.messageCache = {};
              if (state.currentChatId) renderCurrentPage(false);
              showToast("设置已导入", "success");
            } catch (err) {
              showToast("导入失败: " + err.message, "error");
            }
          };
          reader.readAsText(file);

          els.importSettingsFile.click();
        });
        els.importSettingsFile.addEventListener("change", function () {
          if (this.files[0]) importSettings(this.files[0]);
          this.value = "";
        });
        els.clearAllDataBtn.addEventListener("click", async function () {
          var confirmed = await showCustomConfirm(
            "清除所有数据",
            "确定清除所有数据？（包括聊天记录、设置、收藏等）",
          );
          if (!confirmed) return;
          clearAllChatsDB();
          localStorage.removeItem("st_presets");
          localStorage.removeItem("st_activePreset");
          localStorage.removeItem("st_reader_settings_v11");
          location.reload();
        });
        // ============================================================
        // 21. 保存/加载设置
        // ============================================================
        function saveSettings() {
          var data = {
            bookmarks: state.bookmarks,
            extractTags: state.extractTags,
            excludeTags: state.excludeTags,
            regexRules: state.regexRules,
            presets: state.presets,
            activePresetId: state.activePresetId,
            settings: state.settings,
          };
          localStorage.setItem("st_reader_settings_v11", JSON.stringify(data));
        }

        function loadSettings() {
          var raw = localStorage.getItem("st_reader_settings_v11");
          if (raw) {
            try {
              var data = JSON.parse(raw);
              state.bookmarks = data.bookmarks || [];
              state.extractTags = data.extractTags || [];
              state.excludeTags = data.excludeTags || [];
              state.regexRules = data.regexRules || [];
              state.presets = data.presets || [];
              state.activePresetId = data.activePresetId || "default";
              state.settings = Object.assign({}, state.settings, data.settings);
            } catch (e) {
              console.error("加载设置失败", e);
            }
          }
          loadPresets();
          els.extractEnable.checked = state.settings.extractEnabled !== false;
          renderTagList(state.extractTags, els.extractTagList);
          renderTagList(state.excludeTags, els.excludeTagList);
          renderRegexRules();
          renderBookmarkList();
          renderScanResults("extract");
          renderScanResults("exclude");
        }
        // ============================================================
        // 22. 滑动翻页
        // ============================================================
        var touchStartX = 0,
          touchStartY = 0,
          touchStartTime = 0;
        var contentEl = document.getElementById("content");
        contentEl.addEventListener(
          "touchstart",
          function (e) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            touchStartTime = Date.now();
          },
          { passive: true },
        );
        contentEl.addEventListener(
          "touchend",
          function (e) {
            var dx = e.changedTouches[0].clientX - touchStartX,
              dy = e.changedTouches[0].clientY - touchStartY,
              elapsed = Date.now() - touchStartTime;
            if (
              elapsed < 300 &&
              Math.abs(dx) > 50 &&
              Math.abs(dx) > Math.abs(dy) * 1.5
            ) {
              if (dx > 0) changePage(-1);
              else changePage(1);
            }
          },
          { passive: true },
        );
        // ============================================================
        // 23. 截图
        window.exportScreenshotByFloor = async function (floor) {
          if (typeof floor === "string") floor = floor.trim();
          if (!floor) {
            showToast("请输入楼层号", "error");
            return;
          }
          const floorStr = String(floor);
          if (!state.currentChatId) {
            showToast("请先选择聊天", "error");
            return;
          }
          const chat = state.chats[state.currentChatId];
          if (!chat || !chat.messages) {
            showToast("当前聊天不是 JSONL 格式", "error");
            return;
          }

          // 1. 定位目标消息
          const msgs = chat.messages;
          let targetIdx = -1;
          for (let i = 0; i < msgs.length; i++) {
            const msg = msgs[i];
            const f =
              msg.message_id != null && msg.message_id !== ""
                ? String(msg.message_id)
                : msg.id != null && msg.id !== ""
                  ? String(msg.id)
                  : String(i);
            if (f === floorStr) {
              targetIdx = i;
              break;
            }
          }
          if (targetIdx === -1) {
            showToast("未找到楼层 #" + floorStr, "error");
            return;
          }

          // 2. 如果目标不在当前页，跳转并等待渲染
          const pageSize = state.pageSize === -1 ? msgs.length : state.pageSize;
          const page = Math.floor(targetIdx / pageSize) + 1;
          if (page !== state.currentPage) {
            goToPage(page);
            // 等待两帧让新页面完成布局
            await new Promise((r) =>
              requestAnimationFrame(() => requestAnimationFrame(r)),
            );
          }

          // 3. 获取目标 DOM 元素
          const targetEl = document.querySelector(
            '.message[data-floor="' + floorStr + '"]',
          );
          if (!targetEl) {
            showToast("未找到消息元素 #" + floorStr, "error");
            return;
          }

          // 4. 等待内部 iframe 加载完成
          const iframes = targetEl.querySelectorAll("iframe");
          await Promise.all(
            Array.from(iframes).map(
              (ifr) =>
                new Promise((resolve) => {
                  if (
                    ifr.contentWindow &&
                    ifr.contentDocument &&
                    ifr.contentDocument.readyState === "complete"
                  ) {
                    resolve();
                  } else {
                    ifr.addEventListener("load", resolve);
                    setTimeout(resolve, 5000);
                  }
                }),
            ),
          );

          // 5. 获取背景色（若元素透明则使用全局底色）
          const computedBg = window.getComputedStyle(targetEl).backgroundColor;
          const bgColor =
            computedBg &&
            computedBg !== "rgba(0, 0, 0, 0)" &&
            computedBg !== "transparent"
              ? computedBg
              : "#181818";

          // 6. 强制合成层（只对父容器操作，不遍历子元素）
          const originalTransform = targetEl.style.transform;
          targetEl.style.transform = "translateZ(0)";
          void targetEl.offsetHeight; // 强制回流使样式生效

          // 7. 等待 GPU 合成完成（6帧 + 200ms 缓冲）
          await new Promise((resolve) => {
            let frames = 0;
            function waitForComposite() {
              requestAnimationFrame(() => {
                targetEl.getBoundingClientRect(); // 强制重排
                frames++;
                if (frames < 6) {
                  waitForComposite();
                } else {
                  setTimeout(resolve, 200);
                }
              });
            }
            waitForComposite();
          });

          // 8. 调用 html2canvas
          try {
            const canvas = await html2canvas(targetEl, {
              useCORS: true,
              allowTaint: true,
              scale: 1.5,
              logging: false,
              backgroundColor: bgColor,
              onclone: function (clonedDoc) {
                const clonedEl = clonedDoc.querySelector(
                  '.message[data-floor="' + floorStr + '"]',
                );
                if (clonedEl) {
                  // 对克隆体执行同样的强升层
                  clonedEl.style.transform = "translateZ(0)";
                  void clonedEl.offsetHeight;
                  // 克隆体也需等待帧
                  return new Promise((resolve) => {
                    let count = 0;
                    function loop() {
                      requestAnimationFrame(() => {
                        clonedEl.getBoundingClientRect();
                        count++;
                        if (count < 6) loop();
                        else resolve();
                      });
                    }
                    loop();
                  });
                }
              },
            });

            // 9. 恢复原始样式
            targetEl.style.transform = originalTransform || "";

            // 10. 导出截图
            canvas.toBlob(
              function (blob) {
                if (!blob) {
                  showToast("截图生成失败", "error");
                  return;
                }
                const link = document.createElement("a");
                link.download = "楼层_" + floorStr + ".png";
                link.href = URL.createObjectURL(blob);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(() => URL.revokeObjectURL(link.href), 100);
                showToast("截图已导出", "success");
              },
              "image/png",
              1.0,
            );
          } catch (err) {
            // 异常时恢复样式并报错
            targetEl.style.transform = originalTransform || "";
            showToast("截图失败: " + err, "error");
            console.error(err);
          }
        };

        els.screenshotBtn.addEventListener("click", async function () {
          if (
            !state.currentChatId ||
            !state.chats[state.currentChatId] ||
            !state.chats[state.currentChatId].messages
          ) {
            showToast("请先选择 JSONL 聊天", "error");
            return;
          }
          var floor = await showCustomPrompt(
            "导出截图",
            "请输入楼层号 (如 54)",
            "",
          );
          if (floor === null) return;
          floor = floor.trim();
          if (!floor) return;
          exportScreenshotByFloor(floor);
        });
        // ============================================================
        // 24. 主题切换
        // ============================================================
        var isLight = false;
        els.themeBtn.addEventListener("click", function () {
          isLight = !isLight;
          if (isLight) {
            document.body.classList.add("theme-light");
            showToast("切换至日间模式", "success");
          } else {
            document.body.classList.remove("theme-light");
            showToast("切换至夜间模式", "success");
          }
        });
        // ============================================================
        // 25. 初始化
        // ============================================================
        function init() {
          initDB()
            .then(function () {
              return loadAllChats();
            })
            .then(function (chats) {
              state.chats = chats;
              renderChatList();
              updateCacheStatus();
              loadSettings();
              applyStyles();
              els.pageSizeInput.value = state.pageSize;
              var ids = Object.keys(state.chats);
              if (ids.length) {
                var lastId = localStorage.getItem("st_lastChatId");
                var target = lastId && state.chats[lastId] ? lastId : ids[0];
                selectChat(target);
                var lp = parseInt(localStorage.getItem("st_lastPage"));
                if (lp && lp <= state.pages.length) {
                  state.currentPage = lp;
                  renderCurrentPage(false);
                }
              } else {
                els.content.innerHTML =
                  '<div class="welcome-page"><div class="icon">📖</div><h2>欢迎使用酒馆聊天阅读器</h2><p>点击左上角 ≡ 菜单 导入聊天记录</p></div>';
              }
              window.addEventListener("beforeunload", function () {
                if (state.currentChatId) {
                  localStorage.setItem("st_lastChatId", state.currentChatId);
                  localStorage.setItem("st_lastPage", state.currentPage);
                }
              });
              showToast("就绪", "success");
            })
            .catch(function (e) {
              console.error("初始化失败", e);
              showToast("初始化失败: " + e.message, "error");
            });
        }
        // 暴露全局
        window.selectChat = selectChat;
        window.deleteChatItem = deleteChatItem;
        window.toggleBookmark = toggleBookmark;
        window.jumpToBookmark = jumpToBookmark;
        window.deleteBookmarkItem = deleteBookmarkItem;
        window.addExtractTag = addExtractTag;
        window.addExcludeTag = addExcludeTag;
        window.removeTagFromList = removeTagFromList;
        window.deleteRegexRule = deleteRegexRule;
        window.exportScreenshotByFloor = exportScreenshotByFloor;
        init();
      })();
    </script>
  </body>
</html>
