          renderRegexRules();
          if (state.currentChatId) renderCurrentPage(false);
        };

        els.addRegexBtn.addEventListener("click", function () {
          state.regexRules.push({
            pattern: "",
            replacement: "",
            flags: "g",
            enabled: true,
          });
          saveSettings();
          renderRegexRules();
        });

        // ===== 25.5 数据管理 =====
        function exportSettings() {
          var data = {
            bookmarks: state.bookmarks,
            extractTags: state.extractTags,
            excludeTags: state.excludeTags,
            regexRules: state.regexRules,
            presets: state.presets,
            activePresetId: state.activePresetId,
            settings: state.settings,
          };
          var blob = new Blob([JSON.stringify(data, null, 2)], {
            type: "application/json",
          });
          var a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download =
            "st_reader_settings_" +
            new Date().toISOString().slice(0, 10) +
            ".json";
          a.click();
          URL.revokeObjectURL(a.href);
          setStatus("设置已导出", "success");
        }

        function importSettings(file) {
          var reader = new FileReader();
          reader.onload = function (e) {
            try {
              var data = JSON.parse(e.target.result);
              state.bookmarks = data.bookmarks || [];
              state.extractTags = data.extractTags || [];
              state.excludeTags = data.excludeTags || [];
              state.regexRules = data.regexRules || [];
              state.presets = data.presets || [];
              state.activePresetId = data.activePresetId || "default";
              state.settings = Object.assign({}, state.settings, data.settings);
              saveSettings();
              renderTagList(state.extractTags, els.extractTagList);
              renderTagList(state.excludeTags, els.excludeTagList);
              renderRegexRules();
              loadPresets();
              renderBookmarkList();
              if (state.currentChatId) renderCurrentPage(false);
              setStatus("设置已导入", "success");
            } catch (err) {
              setStatus("导入失败: " + err.message, "error");
            }
          };
          reader.readAsText(file);
        }

        els.exportSettingsBtn.addEventListener("click", exportSettings);
        els.importSettingsBtn.addEventListener("click", function () {
          els.importSettingsFile.click();
        });
        els.importSettingsFile.addEventListener("change", function () {
          if (this.files[0]) importSettings(this.files[0]);
          this.value = "";
        });

        els.clearAllDataBtn.addEventListener("click", function () {
          if (!confirm("确定清除所有数据？（包括聊天记录、设置、收藏等）"))
            return;
          clearAllChatsDB();
          localStorage.removeItem("st_presets");
          localStorage.removeItem("st_activePreset");
          localStorage.removeItem("st_reader_settings_v11");
          location.reload();
        });

        // ===== 26. 保存/加载设置 =====
        function saveSettings() {
          var data = {
            bookmarks: state.bookmarks,
            extractTags: state.extractTags,
            excludeTags: state.excludeTags,
            regexRules: state.regexRules,
            presets: state.presets,
            activePresetId: state.activePresetId,
            settings: state.settings,
          };
          localStorage.setItem("st_reader_settings_v11", JSON.stringify(data));
        }

        function loadSettings() {
          var raw = localStorage.getItem("st_reader_settings_v11");
          if (raw) {
            try {
              var data = JSON.parse(raw);
              state.bookmarks = data.bookmarks || [];
              state.extractTags = data.extractTags || [];
              state.excludeTags = data.excludeTags || [];
              state.regexRules = data.regexRules || [];
              state.presets = data.presets || [];
              state.activePresetId = data.activePresetId || "default";
              state.settings = Object.assign({}, state.settings, data.settings);
            } catch (e) {
              console.error("加载设置失败", e);
            }
          }
          loadPresets();
          els.extractEnable.checked = state.settings.extractEnabled !== false;
          renderTagList(state.extractTags, els.extractTagList);
          renderTagList(state.excludeTags, els.excludeTagList);
          renderRegexRules();
          renderBookmarkList();
          renderScanResults("extract");
          renderScanResults("exclude");
        }

        // ===== 27. 滑动翻页 =====
        var touchStartX = 0,
          touchStartY = 0,
          touchStartTime = 0;
        var contentEl = document.getElementById("content");
        contentEl.addEventListener(
          "touchstart",
          function (e) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            touchStartTime = Date.now();
          },
          { passive: true },
        );
        contentEl.addEventListener(
          "touchend",
          function (e) {
            var deltaX = e.changedTouches[0].clientX - touchStartX;
            var deltaY = e.changedTouches[0].clientY - touchStartY;
            var elapsed = Date.now() - touchStartTime;
            if (
              elapsed < 300 &&
              Math.abs(deltaX) > 50 &&
              Math.abs(deltaX) > Math.abs(deltaY) * 1.5
            ) {
              if (deltaX > 0) changePage(-1);
              else changePage(1);
            }
          },
          { passive: true },
        );

        // ===== 28. 初始化 =====
        function init() {
          initDB()
            .then(function () {
              return loadAllChats();
            })
            .then(function (chats) {
              state.chats = chats;
              renderChatList();
              updateCacheStatus();
              loadSettings();
              applyStyles();
              // 设置初始每页条数
              els.pageSizeInput.value = state.pageSize;
              var ids = Object.keys(state.chats);
              if (ids.length > 0) {
                var lastId = localStorage.getItem("st_lastChatId");
                var targetId = lastId && state.chats[lastId] ? lastId : ids[0];
                selectChat(targetId);
                var lastPage = parseInt(localStorage.getItem("st_lastPage"));
                if (lastPage && lastPage <= state.pages.length) {
                  state.currentPage = lastPage;
                  renderCurrentPage(false);
                }
              } else {
                els.content.innerHTML =
                  '<div class="welcome-page"><div class="icon">📖</div><h2>欢迎使用酒馆聊天阅读器</h2><p>点击左上角 ☰ 导入聊天记录</p></div>';
              }
              window.addEventListener("beforeunload", function () {
                if (state.currentChatId) {
                  localStorage.setItem("st_lastChatId", state.currentChatId);
                  localStorage.setItem("st_lastPage", state.currentPage);
                }
              });
              setStatus("就绪", "success");
            })
            .catch(function (e) {
              console.error("初始化失败", e);
              setStatus("初始化失败: " + e.message, "error");
            });
        }

        // 暴露全局
        window.selectChat = selectChat;
        window.deleteChatItem = deleteChatItem;
        window.toggleBookmark = toggleBookmark;
        window.jumpToBookmark = jumpToBookmark;
        window.deleteBookmarkItem = deleteBookmarkItem;
        window.clearAllChats = clearAllChats;
        window.addExtractTag = addExtractTag;
        window.addExcludeTag = addExcludeTag;
        window.removeTagFromList = removeTagFromList;
        window.deleteRegexRule = deleteRegexRule;

        init();
      })();
    </script>
  </body>
</html>
